<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <linearGradient id="arrowBody" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2200"/>
      <stop offset="55%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#ffb066"/>
    </linearGradient>
    <linearGradient id="arrowBolt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9b0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Shaft -->
  <path d="M30 300 L70 300 L150 90 L190 90 L190 50 L70 50 L70 90 L110 90 Z"
        fill="url(#arrowBody)" opacity="0.92"/>
  <!-- Arrowhead -->
  <path d="M120 10 L210 10 L210 100 L170 60 L60 170 L30 140 L140 50 Z"
        fill="url(#arrowBody)"/>
  <!-- Inner bolt highlight -->
  <path d="M150 70 L95 150 L120 150 L85 230 L170 120 L140 120 Z"
        fill="url(#arrowBolt)" opacity="0.9"/>
</svg>
