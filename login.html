<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Michaela Nagac</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <img src="assets/images/arrow-bolt.svg" alt="" class="hero-arrow hero-arrow-top" aria-hidden="true">
  <img src="assets/images/arrow-bolt.svg" alt="" class="hero-arrow hero-arrow-bottom" aria-hidden="true">

  <main class="login-wrap">
    <a href="index.html" class="login-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to portfolio</a>

    <section class="login-card" aria-labelledby="loginTitle">
      <a href="index.html" class="nav-logo login-logo">Michaela<span>.</span>Nagac</a>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="login-sub">Admin sign in — manage your portfolio.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="username" required>
          <span class="form-error" id="loginEmailError"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="form-error" id="loginPasswordError"></span>
        </div>

        <div class="login-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="login-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary login-submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" hidden></span>
        </button>

        <p class="form-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
