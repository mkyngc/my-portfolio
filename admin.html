<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Portfolio</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-top">
    <strong class="admin-brand">Admin<span>.</span>Dashboard</strong>
    <div class="admin-actions">
      <button class="mini" id="previewBtn"><i class="fa-solid fa-eye"></i> Preview draft</button>
      <button class="mini" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>
  <div class="admin-layout">
    <nav class="admin-nav" id="adminNav" aria-label="Sections"></nav>
    <main class="admin-main">
      <h1 id="sectionTitle"></h1>
      <div id="sectionBody"></div>
      <p class="status" id="status" role="status" aria-live="polite">Changes save automatically as a draft in this browser.</p>
    </main>
  </div>
  <script src="js/content-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
